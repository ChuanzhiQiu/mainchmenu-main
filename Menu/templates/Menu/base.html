<!DOCTYPE html>
<html lang="es">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MainchApp — Restaurant POS & KDS</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fffbeb',
                            100: '#fef3c7',
                            500: '#f59e0b',
                            600: '#d97706',
                            700: '#b45309',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Legacy compatibility styles */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.25rem;
        }

        .content {
            background-color: #ffffff;
            border-radius: 0.75rem;
            padding: 1.5rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem 1rem;
            margin: 0.25rem;
            text-decoration: none;
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 0.875rem;
            transition: all 0.15s ease-in-out;
            cursor: pointer;
        }

        .btn-primary {
            background-color: #f59e0b;
            border: none;
            color: white;
        }

        .btn-primary:hover {
            background-color: #d97706;
            color: white;
        }

        .btn-success {
            background-color: #10b981;
            border: none;
            color: white;
        }

        .btn-success:hover {
            background-color: #059669;
            color: white;
        }

        .btn-danger {
            background-color: #ef4444;
            border: none;
            color: white;
        }

        .btn-danger:hover {
            background-color: #dc2626;
            color: white;
        }

        .btn-secondary {
            background-color: #475569;
            border: none;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #334155;
            color: white;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col text-slate-800 antialiased">

    <!-- Global Toast Container (Fixed Top Right) -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none">
        {% if messages %}
            {% for message in messages %}
                <div class="toast-item pointer-events-auto flex items-start gap-3 p-4 rounded-xl shadow-lg border text-sm font-semibold transition-all duration-300 transform translate-y-0 opacity-100 {% if message.tags == 'error' %}bg-rose-50 border-rose-200 text-rose-900{% elif message.tags == 'warning' %}bg-amber-50 border-amber-200 text-amber-900{% elif message.tags == 'success' %}bg-emerald-50 border-emerald-200 text-emerald-900{% else %}bg-blue-50 border-blue-200 text-blue-900{% endif %}" role="alert">
                    <div class="flex-1 leading-snug">{{ message }}</div>
                    <button type="button" class="text-slate-400 hover:text-slate-600 transition" onclick="this.parentElement.remove()" aria-label="Cerrar notificación">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>
            {% endfor %}
        {% endif %}
    </div>

    <!-- Modern Responsive Navigation Bar -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Brand / Logo -->
                <div class="flex items-center gap-3">
                    <a href="{% url 'Menu:inicio' %}" class="flex items-center gap-2.5 text-white font-extrabold text-lg sm:text-xl tracking-tight hover:opacity-90 transition">
                        <div class="w-8 h-8 rounded-lg bg-amber-500 flex items-center justify-center text-slate-950 font-black shadow-md">
                            M
                        </div>
                        <span class="text-white">Mainch<span class="text-amber-400">App</span></span>
                    </a>
                </div>

                <!-- Nav Links -->
                <nav class="flex items-center gap-1 sm:gap-2">
                    <a href="{% url 'Menu:inicio' %}" 
                       class="px-3 py-2 rounded-lg text-xs sm:text-sm font-semibold text-slate-300 hover:text-white hover:bg-slate-800 transition inline-flex items-center gap-1.5"
                       title="Cocina en Vivo (KDS)">
                        <i data-lucide="utensils" class="w-4 h-4 text-amber-400"></i>
                        <span>Cocina KDS</span>
                    </a>

                    <a href="{% url 'Menu:pedidos_crear' %}" 
                       class="px-3 py-2 rounded-lg text-xs sm:text-sm font-semibold text-slate-300 hover:text-white hover:bg-slate-800 transition inline-flex items-center gap-1.5"
                       title="Punto de Venta (POS)">
                        <i data-lucide="shopping-bag" class="w-4 h-4 text-emerald-400"></i>
                        <span>POS</span>
                    </a>

                    <a href="{% url 'Menu:inventario' %}" 
                       class="px-3 py-2 rounded-lg text-xs sm:text-sm font-semibold text-slate-300 hover:text-white hover:bg-slate-800 transition inline-flex items-center gap-1.5"
                       title="Inventario y Alertas">
                        <i data-lucide="boxes" class="w-4 h-4 text-indigo-400"></i>
                        <span>Inventario</span>
                    </a>

                    <a href="{% url 'Menu:crud' %}" 
                       class="px-3 py-2 rounded-lg text-xs sm:text-sm font-semibold text-slate-300 hover:text-white hover:bg-slate-800 transition inline-flex items-center gap-1.5"
                       title="Edición de Menú y Platos">
                        <i data-lucide="edit-3" class="w-4 h-4 text-slate-400"></i>
                        <span class="hidden md:inline">Edición</span>
                    </a>

                    <a href="{% url 'Menu:data_analisis' %}" 
                       class="px-3 py-2 rounded-lg text-xs sm:text-sm font-semibold text-slate-300 hover:text-white hover:bg-slate-800 transition inline-flex items-center gap-1.5"
                       title="Analítica de Ventas">
                        <i data-lucide="bar-chart-3" class="w-4 h-4 text-slate-400"></i>
                        <span class="hidden lg:inline">Data Análisis</span>
                    </a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 w-full">
        {% block content %}{% endblock %}
    </main>

    <!-- Client-side Toast & Icon Orchestration -->
    <script>
        // Global Toast Notification Helper
        window.showToast = function(message, type = 'info', duration = 5000) {
            let container = document.getElementById("toast-container");
            if (!container) {
                container = document.createElement("div");
                container.id = "toast-container";
                container.className = "fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none";
                document.body.appendChild(container);
            }

            const toast = document.createElement("div");
            toast.className = `toast-item pointer-events-auto flex items-start gap-3 p-4 rounded-xl shadow-lg border text-sm font-semibold transition-all duration-300 transform translate-y-2 opacity-0 ${
                type === 'warning' ? 'bg-amber-50 border-amber-200 text-amber-900' :
                type === 'error' ? 'bg-rose-50 border-rose-200 text-rose-900' :
                type === 'success' ? 'bg-emerald-50 border-emerald-200 text-emerald-900' :
                'bg-blue-50 border-blue-200 text-blue-900'
            }`;

            const iconName = type === 'warning' ? 'alert-triangle' : (type === 'error' ? 'alert-octagon' : (type === 'success' ? 'check-circle' : 'info'));
            
            const iconEl = document.createElement("i");
            iconEl.setAttribute("data-lucide", iconName);
            iconEl.className = "w-5 h-5 flex-shrink-0 mt-0.5";

            const msgDiv = document.createElement("div");
            msgDiv.className = "flex-1 leading-snug";
            msgDiv.textContent = message;

            const closeBtn = document.createElement("button");
            closeBtn.type = "button";
            closeBtn.className = "text-slate-400 hover:text-slate-600 transition";
            closeBtn.innerHTML = '<i data-lucide="x" class="w-4 h-4"></i>';
            closeBtn.onclick = () => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 250);
            };

            toast.appendChild(iconEl);
            toast.appendChild(msgDiv);
            toast.appendChild(closeBtn);

            container.appendChild(toast);
            if (window.lucide) lucide.createIcons({ root: toast });

            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, duration);
        };

        // Initialize Lucide Icons on DOM ready
        document.addEventListener("DOMContentLoaded", () => {
            if (window.lucide) {
                lucide.createIcons();
            }

            // Auto-dismiss initial Django toasts after 5s
            const initialToasts = document.querySelectorAll("#toast-container .toast-item");
            initialToasts.forEach((t) => {
                setTimeout(() => {
                    t.classList.add('opacity-0', 'translate-y-2');
                    setTimeout(() => t.remove(), 300);
                }, 5000);
            });
        });

        // Re-initialize Lucide Icons after HTMX DOM swaps
        document.body.addEventListener("htmx:afterSwap", () => {
            if (window.lucide) {
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
