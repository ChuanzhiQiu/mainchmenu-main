{% extends 'Menu/base.html' %}

{% block content %}
<div class="min-h-[calc(100vh-5rem)] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-2xl shadow-xl border border-slate-100">
        <div class="text-center">
            <div class="mx-auto w-14 h-14 bg-emerald-500 rounded-2xl flex items-center justify-center text-slate-950 font-black text-2xl shadow-lg mb-4">
                M
            </div>
            <h2 class="text-2xl font-black text-slate-900 tracking-tight">Acceso de Restaurante</h2>
            <p class="text-sm text-slate-500 mt-2">
                Inicia sesión con las credenciales de tu local para operar Cocina y Punto de Venta.
            </p>
        </div>

        {% if error %}
        <div class="p-4 rounded-xl bg-rose-50 border border-rose-200 text-rose-800 text-sm font-medium flex items-center gap-3">
            <i data-lucide="alert-circle" class="w-5 h-5 text-rose-600 flex-shrink-0"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form class="mt-8 space-y-6" method="POST" action="{% url 'Menu:login_restaurante' %}">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next_url }}">

            <div class="space-y-4">
                <div>
                    <label for="username" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Usuario del Local</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="store" class="w-4 h-4"></i>
                        </div>
                        <input id="username" name="username" type="text" required
                               class="block w-full pl-10 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 focus:bg-white transition"
                               placeholder="Ej: hamburguesas_juan" value="{{ username|default:'' }}">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Contraseña</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="lock" class="w-4 h-4"></i>
                        </div>
                        <input id="password" name="password" type="password" required
                               class="block w-full pl-10 pr-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-sm focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 focus:bg-white transition"
                               placeholder="••••••••">
                    </div>
                </div>
            </div>

            <div>
                <button type="submit"
                        class="w-full py-3 px-4 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold rounded-xl shadow-md hover:shadow-lg transition flex items-center justify-center gap-2">
                    <i data-lucide="log-in" class="w-4 h-4"></i>
                    <span>Entrar al Restaurante</span>
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
